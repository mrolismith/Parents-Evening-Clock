
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Clock</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 750px;
}

h1 {
  font-size: 24px;
  color: #94a3b8;
  font-weight: normal;
}

#clock {
  font-size: clamp(65px, 15vw, 125px);
  font-weight: bold;
  margin: 20px 0;
  font-variant-numeric: tabular-nums;
}

#date {
  font-size: 24px;
  color: #cbd5e1;
  margin-bottom: 45px;
}

.countdown-label {
  font-size: 22px;
  color: #94a3b8;
}

#countdown {
  font-size: 55px;
  color: #60a5fa;
  margin: 15px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

button {
  padding: 16px 35px;
  margin: 12px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

#start {
  background: #2563eb;
  color: white;
}

#stop {
  background: #dc2626;
  color: white;
}

button:hover {
  opacity: 0.85;
}

#status {
  color: #86efac;
  font-size: 16px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <h1>SCHOOL CLOCK</h1>

  <div id="clock">00:00:00</div>

  <div id="date"></div>

  <div class="countdown-label">
    TIME UNTIL NEXT BELL
  </div>

  <div id="countdown">10:00</div>

  <button id="start" onclick="startBell()">
    START BELL
  </button>

  <button id="stop" onclick="stopBell()">
    STOP BELL
  </button>

  <div id="status">Bell is stopped</div>

</div>

<script>

let bellTimer = null;
let countdownTimer = null;
let nextBell = null;
let audioContext = null;

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-GB", {
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-GB", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

function playBell() {

  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(
    880, audioContext.currentTime
  );

  gain.gain.setValueAtTime(
    0.5, audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001, audioContext.currentTime + 2
  );

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 2);
}

function startBell() {

  if (bellTimer) return;

  audioContext = new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  audioContext.resume();

  nextBell = Date.now() + 10 * 60 * 1000;

  bellTimer = setInterval(() => {
    playBell();
    nextBell = Date.now() + 10 * 60 * 1000;
  }, 10 * 60 * 1000);

  countdownTimer = setInterval(updateCountdown, 250);

  document.getElementById("status").textContent =
    "Bell is active";

  updateCountdown();
}

function stopBell() {

  clearInterval(bellTimer);
  clearInterval(countdownTimer);

  bellTimer = null;
  countdownTimer = null;
  nextBell = null;

  document.getElementById("countdown").textContent = "10:00";

  document.getElementById("status").textContent =
    "Bell is stopped";
}

function updateCountdown() {

  if (!nextBell) return;

  const remaining = Math.max(0, nextBell - Date.now());

  const minutes = Math.floor(remaining / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  document.getElementById("countdown").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
}

setInterval(updateClock, 250);
updateClock();

</script>

</body>
</html>

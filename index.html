<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Clock</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 850px;
}

h1 {
  font-size: 26px;
  color: #94a3b8;
  font-weight: normal;
  letter-spacing: 4px;
}

#clock {
  font-size: clamp(65px, 15vw, 130px);
  font-weight: bold;
  margin: 20px 0;
  font-variant-numeric: tabular-nums;
}

#date {
  font-size: 24px;
  color: #cbd5e1;
  margin-bottom: 55px;
}

.countdown-label {
  font-size: 22px;
  color: #94a3b8;
  letter-spacing: 2px;
}

#countdown {
  font-size: 65px;
  color: #60a5fa;
  margin: 15px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

button {
  padding: 17px 40px;
  margin: 12px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;
}

#start {
  background: #2563eb;
  color: white;
}

#stop {
  background: #dc2626;
  color: white;
}

button:hover {
  opacity: 0.85;
}

#status {
  color: #86efac;
  font-size: 18px;
  margin-top: 25px;
}

</style>
</head>

<body>

<div class="container">

  <h1>SCHOOL CLOCK</h1>

  <div id="clock">00:00:00</div>

  <div id="date"></div>

  <div class="countdown-label">
    TIME UNTIL NEXT BELL
  </div>

  <div id="countdown">10:00</div>

  <button id="start" onclick="startBell()">
    START BELL
  </button>

  <button id="stop" onclick="stopBell()">
    STOP BELL
  </button>

  <div id="status">Bell is stopped</div>

</div>

<script>

// =====================================
// CLOCK DISPLAY
// =====================================

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-GB", {
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-GB", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

}


// =====================================
// AUDIO SETUP
// =====================================

let audioContext = null;

function playBell() {

  if (!audioContext) return;

  const now = audioContext.currentTime;

  // Two pleasant bell tones

  [880, 660].forEach((frequency, index) => {

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "sine";

    const startTime = now + index * 0.45;

    oscillator.frequency.setValueAtTime(
      frequency,
      startTime
    );

    gain.gain.setValueAtTime(0.4, startTime);

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      startTime + 1.5
    );

    oscillator.start(startTime);

    oscillator.stop(startTime + 1.5);

  });

}


// =====================================
// FIND THE NEXT BELL TIME
// =====================================

function getNextBellTime() {

  const now = new Date();

  const next = new Date(now);

  next.setSeconds(0, 0);

  const nextMinute =
    (Math.floor(now.getMinutes() / 10) + 1) * 10;

  next.setMinutes(nextMinute);

  return next;

}


// =====================================
// COUNTDOWN
// =====================================

function updateCountdown() {

  const now = new Date();

  const nextBell = getNextBellTime();

  const remaining = nextBell.getTime() - now.getTime();

  const minutes = Math.floor(remaining / 60000);

  const seconds = Math.floor(
    (remaining % 60000) / 1000
  );

  document.getElementById("countdown").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");

}


// =====================================
// BELL SCHEDULING
// =====================================

let bellActive = false;
let bellTimer = null;

function scheduleNextBell() {

  if (!bellActive) return;

  const nextBell = getNextBellTime();

  const targetTime = nextBell.getTime();

  const delay = targetTime - Date.now();

  bellTimer = setTimeout(() => {

    if (!bellActive) return;

    const actualTime = Date.now();

    // Ring only if the timer fired close to
    // the scheduled time. Do not ring late
    // after a computer wakes from sleep.

    if (actualTime - targetTime <= 3000) {

      playBell();

      document.getElementById("status").textContent =
        "Bell sounded - next bell scheduled";

    }

    // Schedule the next 10-minute interval

    scheduleNextBell();

  }, delay);

}


// =====================================
// START BELL
// =====================================

async function startBell() {

  if (bellActive) return;

  try {

    if (!audioContext) {

      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }

    await audioContext.resume();

    bellActive = true;

    document.getElementById("status").textContent =
      "Bell is active";

    scheduleNextBell();

    updateCountdown();

  }

  catch (error) {

    document.getElementById("status").textContent =
      "Audio error - please try again";

    console.error(error);

  }

}


// =====================================
// STOP BELL
// =====================================

function stopBell() {

  bellActive = false;

  clearTimeout(bellTimer);

  bellTimer = null;

  document.getElementById("status").textContent =
    "Bell is stopped";

  updateCountdown();

}


// =====================================
// UPDATE DISPLAY
// =====================================

setInterval(updateClock, 250);

setInterval(updateCountdown, 250);

updateClock();

updateCountdown();

</script>

</body>
</html>
